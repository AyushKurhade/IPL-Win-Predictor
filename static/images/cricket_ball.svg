<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="ballShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff5e62" />
      <stop offset="40%" stop-color="#d62828" />
      <stop offset="100%" stop-color="#800f14" />
    </radialGradient>
    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Cricket Ball Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#ballShine)" filter="url(#ballShadow)" />
  <!-- Ball Seam Curve -->
  <path d="M 18,18 Q 50,50 82,82" fill="none" stroke="#fdf0d5" stroke-width="3" stroke-linecap="round"/>
  <path d="M 18,18 Q 50,50 82,82" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,3"/>
  <!-- Ball Seam Stitches -->
  <line x1="26" y1="24" x2="22" y2="28" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="33" y1="31" x2="29" y2="35" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="40" y1="38" x2="36" y2="42" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="47" y1="45" x2="43" y2="49" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="54" y1="52" x2="50" y2="56" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="61" y1="59" x2="57" y2="63" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="68" y1="66" x2="64" y2="70" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="75" y1="73" x2="71" y2="77" stroke="#ffffff" stroke-width="1.5"/>
</svg>

